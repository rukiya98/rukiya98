# ─────────────────────────────────────────────────────────────
#  Profile Metrics
#  Target path in repo:  .github/workflows/metrics.yml
#
#  Generates static SVG cards and commits them straight into
#  your repo. Because they're committed files, they render
#  instantly and can NEVER rate-limit or 503 on you.
#
#  Requires ONE repo secret: METRICS_TOKEN
#  (see SETUP.md — you create it, nobody else ever sees it)
# ─────────────────────────────────────────────────────────────

name: Generate Metrics

on:
  schedule:
    # 05:30 UTC daily = 11:00 AM Sri Lanka time
    - cron: "30 5 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  # ── Card 1: overview, activity and community ──────────────
  overview:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: rukiya98
          filename: metrics/overview.svg
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Colombo
          config_display: large
          config_animations: yes

          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_filter: issue, pr, release, push, review
          plugin_activity_visibility: all

          plugin_achievements: yes
          plugin_achievements_threshold: B
          plugin_achievements_secrets: yes
          plugin_achievements_display: compact
          plugin_achievements_limit: 0

  # ── Card 2: languages, weighted by recent work ────────────
  languages:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: rukiya98
          filename: metrics/languages.svg
          template: classic
          base: ""
          config_timezone: Asia/Colombo

          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used, recently-used
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 15
          # Stops vendored web assets from drowning out real work
          plugin_languages_ignored: >-
            html, css, scss, tex, makefile, dockerfile,
            jupyter notebook, batchfile, powershell

  # ── Card 3: contribution calendar + coding habits ─────────
  habits:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: rukiya98
          filename: metrics/habits.svg
          template: classic
          base: ""
          config_timezone: Asia/Colombo

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_trim: yes
